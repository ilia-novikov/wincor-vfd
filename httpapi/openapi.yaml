openapi: 3.0.3
info:
  title: Wincor VFD REST API
  description: >
    Controls a Wincor Nixdorf VFD customer display over HTTP. Each request
    opens and closes the underlying HID device itself; the server never
    holds it open between requests.
  version: "1.0.0"

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness check
      description: Always returns 200 if the process is running. Does not touch the device.
      security: []
      responses:
        "200":
          description: Process is alive.

  /readyz:
    get:
      summary: Readiness check
      description: Enumerates HID devices to confirm the display is present, without opening it.
      security: []
      responses:
        "200":
          description: Display is present.
        "503":
          description: Display is not present.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/print:
    post:
      summary: Print text at the current cursor position
      parameters:
        - $ref: "#/components/parameters/Charset"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "204":
          description: Printed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/clear:
    post:
      summary: Clear the whole display
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Cleared.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/init:
    post:
      summary: Clear, select charset, and reset the cursor to (0, 0)
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Initialized.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/cursor:
    put:
      summary: Move the cursor to the given 0-based column/row
      parameters:
        - $ref: "#/components/parameters/Charset"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y]
              properties:
                x:
                  type: integer
                y:
                  type: integer
      responses:
        "204":
          description: Moved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/backspace:
    post:
      summary: Move the cursor one space to the left
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Done.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/linefeed:
    post:
      summary: Move the cursor down a line
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Done.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/carriage-return:
    post:
      summary: Move the cursor to the start of the current line
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Done.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

  /v1/delete-to-eol:
    post:
      summary: Erase text to the end of the current line
      parameters:
        - $ref: "#/components/parameters/Charset"
      responses:
        "204":
          description: Done.
        "503":
          $ref: "#/components/responses/DeviceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Required only if the server was started with VFD_API_TOKEN set.
        Applies to /v1/* routes only; /healthz and /readyz are always open.

  parameters:
    Charset:
      name: charset
      in: query
      required: false
      schema:
        type: string
        enum: [us, ru]
        default: us

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceUnavailable:
      description: Display could not be opened or written to.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
